name: FastAPI CI

on:
  push:
    paths:
      - "fastapi_employee_api/**"
      - ".github/workflows/fastapi-ci.yml"
  pull_request:
    paths:
      - "fastapi_employee_api/**"
      - ".github/workflows/fastapi-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi_employee_api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
